<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator · SGPA & CGPA Calculator</title>
<meta name="description" content="Pick your university, course, branch, batch and semester — subjects and credits load automatically. Choose grades to get SGPA, CGPA and percentage.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<main id="main">
  <h1>SGPA &amp; CGPA Calculator</h1>
  <p class="muted">Choose your course details step by step. Your subjects and credits load automatically — you only pick grades.</p>

  <!-- Steps 1–3 -->
  <section class="card" aria-labelledby="setupTitle">
    <div class="card-head">
      <h2 id="setupTitle">Your course</h2>
      <button type="button" class="btn danger sm" id="resetBtn">Reset</button>
    </div>
    <div class="grid-3">
      <div class="field">
        <label for="uniSelect"><span class="step-num">1</span>University</label>
        <select id="uniSelect" disabled><option>Loading…</option></select>
      </div>
      <div class="field">
        <label for="courseSelect"><span class="step-num">2</span>Course</label>
        <select id="courseSelect" disabled><option value="">Select university first</option></select>
      </div>
      <div class="field">
        <label for="branchSelect"><span class="step-num">3</span>Branch</label>
        <select id="branchSelect" disabled><option value="">Select course first</option></select>
      </div>
    </div>
    <p id="schemeNote" class="small muted" hidden></p>
    <div id="setupStatus" aria-live="polite"></div>
  </section>

  <!-- Step 4+: one card per semester -->
  <div id="semList"></div>
  <div class="btn-row" id="addSemRow" hidden>
    <button type="button" class="btn ghost" id="addSemBtn">+ Add another semester</button>
  </div>

  <!-- Summary -->
  <section class="card" id="summaryCard" aria-labelledby="summaryTitle" hidden style="margin-top:16px">
    <div class="card-head">
      <h2 id="summaryTitle">Summary</h2>
      <button type="button" class="btn sm" id="pdfBtn">⬇ Download result as PDF</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">Semester</th><th scope="col" class="num">Credits</th><th scope="col" class="num">SGPA</th><th scope="col">Status</th></tr></thead>
        <tbody id="summaryRows"></tbody>
      </table>
    </div>
    <div class="stats">
      <div class="stat"><span>CGPA</span><strong id="cgpaOut">0.00</strong></div>
      <div class="stat"><span>Percentage</span><strong id="pctOut">0.00%</strong></div>
      <div class="stat"><span>Total credits</span><strong id="creditsOut">0</strong></div>
    </div>
    <p class="small muted" id="formulaOut"></p>
    <div id="pdfStatus" aria-live="polite"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="js/api.js"></script>
<script src="js/calculator.js"></script>
</body>
</html>
